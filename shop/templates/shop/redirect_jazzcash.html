<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Payment Gateway...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container text-center my-5 py-5">
    <div class="spinner-border {% if gateway == 'easypaisa' %}text-success{% else %}text-danger{% endif %} mb-3" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
    </div>

    <h3 class="fw-bold">
        {% if gateway == 'easypaisa' %}
            Connecting to Easypaisa...
        {% else %}
            Connecting to JazzCash...
        {% endif %}
    </h3>
    <p class="text-muted">Please do not refresh or close this page while we transfer you to the secure payment gateway.</p>

    <!-- Unified dynamic redirect form -->
    <form id="payment_form" action="{% if gateway == 'easypaisa' %}{{ easypaisa_url }}{% else %}{{ jazzcash_url }}{% endif %}" method="POST">
        {% for key, value in payload.items %}
            <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}

        <!-- Fallback submit button for non-JS users -->
        <noscript>
            <button type="submit" class="btn {% if gateway == 'easypaisa' %}btn-success{% else %}btn-danger{% endif %} mt-3">
                Click here to continue to {% if gateway == 'easypaisa' %}Easypaisa{% else %}JazzCash{% endif %}
            </button>
        </noscript>
    </form>

    <button type="button" id="manualBtn" onclick="submitForm()" class="btn {% if gateway == 'easypaisa' %}btn-outline-success{% else %}btn-outline-danger{% endif %} mt-3 d-none">
        Click here if not redirected automatically
    </button>
</div>

<script>
    function submitForm() {
        var form = document.getElementById("payment_form");
        if (form) {
            form.submit();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', submitForm);
    } else {
        submitForm();
    }

    setTimeout(function() {
        var btn = document.getElementById("manualBtn");
        if (btn) btn.classList.remove("d-none");
    }, 3000);
</script>

</body>
</html>
