{% extends 'shop/basic.html' %}


{% block title %} Title of About {% endblock %}

{% block body %}

    <div class="contact-container">
    <div class="contact-header">
        <h2>Contact Us</h2>
        <p>Have questions or feedback? Send us a message below.</p>
    </div>

    <form action="/shop/contact/" method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" class="form-control-custom" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" class="form-control-custom" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" class="form-control-custom" id="phone" name="phone" placeholder="Enter your phone number">
        </div>

        <div class="form-group">
            <label for="desc">How can we help you?</label>
            <textarea class="form-control-custom" id="desc" name="desc" rows="4" placeholder="Type your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit</button>
    </form>
</div>
{% endblock %}

{% block js %}
    <div id="thank-status" data-thank="{% if thank %}true{% else %}false{% endif %}" style="display: none;"></div>
    <script>
        const statusEl = document.getElementById('thank-status');
        if (statusEl && statusEl.getAttribute('data-thank') === 'true') {
            alert("Thanks for contacting us, we will get back to you soon!");
            document.location = "/shop/contact/";
        }
    </script>
{% endblock %}
