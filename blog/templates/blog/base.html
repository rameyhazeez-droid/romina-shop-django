/* --- Custom Carousel Slider Layout --- */
.main-content {
    max-width: 1200px;
    margin: 2.5rem auto;
    padding: 0 1rem;
    box-sizing: border-box;
}
.category-section {
    margin-bottom: 3rem;
}
.category-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.carousel-container {
    position: relative;
    overflow: hidden;
    width: 100%;
}

/* Track holding slides */
.carousel-inner-track {
    display: flex;
    transition: transform 0.4s ease-in-out;
    width: 100%;
}

/* Grouping wrapper */
.carousel-slide-group {
    display: flex;
    flex-shrink: 0;
    width: 100%;
    gap: 1rem;
    box-sizing: border-box;
    justify-content: flex-start;
}

/* --- Card Structural Styling --- */
.card {
    background-color: #ffffff;
    border-radius: 0.5rem;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: calc((100% - 5rem) / 6);
    box-sizing: border-box;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
}
.card-img-top {
    width: 100%;
    height: 130px;
    object-fit: cover;
    background-color: #eaede6;
}
.card-body {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}
.card-title {
    margin: 0 0 0.5rem 0;
    font-size: 1rem;
    font-weight: 600;
    color: #1a202c;
}
.card-text {
    margin: 0 0 1rem 0;
    font-size: 0.85rem;
    color: #4a5568;
    line-height: 1.4;
    flex-grow: 1;
}
.btn-primary {
    display: block;
    text-align: center;
    background-color: #0d6efd;
    color: #ffffff;
    text-decoration: none;
    padding: 0.5rem 0.75rem;
    border-radius: 0.375rem;
    font-size: 0.85rem;
    border: none;
    cursor: pointer;
}

/* --- Carousel Controls Styling --- */
.carousel-controls-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.5rem;
    margin-top: 1.5rem;
}
.carousel-control-prev, .carousel-control-next {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 45px;
    height: 45px;
    background-color: #121212;
    border-radius: 50%;
    color: #ffffff;
    text-decoration: none;
    cursor: pointer;
    border: none;
}
.carousel-control-prev-icon, .carousel-control-next-icon {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-top: 3px solid #ffffff;
    border-left: 3px solid #ffffff;
}
.carousel-control-prev-icon { transform: rotate(-45deg) translate(2px, 2px); }
.carousel-control-next-icon { transform: rotate(135deg) translate(2px, 2px); }

/* --- Responsive Recalibrations --- */
@media (max-width: 1000px) { .card { width: calc((100% - 3rem) / 4); } }
@media (max-width: 768px) { .card { width: calc((100% - 2rem) / 3); } }
@media (max-width: 500px) { .card { width: calc((100% - 1rem) / 2); } }

            width: 100%;

            gap: 1.5rem;

            background: #ffffff;
            padding: 2rem;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

        /* Base Button Styles */
        .btn-buy, .btn-cart {
            flex: 1;
            padding: 0.6rem;
            font-weight: bold;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease, border-color 0.2s ease;

            background-color: #0d6efd;
            color: white;
            border: none;
        }

        .btn-cart {
            background-color: transparent;
            color: #0d6efd;
            border: 1px solid #0d6efd;
        }

        /* --- CLICK ANIMATIONS --- */

        .btn-buy.click-blink {
            animation: flashGreen 0.4s ease-in-out;
        }

        .btn-cart.click-blink {
            animation: flashOrange 0.4s ease-in-out;
        }

        @keyframes flashGreen {
            0% { background-color: #0d6efd; transform: scale(0.98); }
            50% { background-color: #198754; transform: scale(1.03); }
            100% { background-color: #0d6efd; transform: scale(1); }
        }

        @keyframes flashOrange {
            0% { background-color: transparent; color: #0d6efd; transform: scale(0.98); }
            50% { background-color: #ffc107; color: #000; border-color: #ffc107; transform: scale(1.03); }
